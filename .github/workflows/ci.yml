name: CI
on:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4

      - name: install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo mv /tmp/hadolint /usr/local/bin/hadolint
          sudo chmod +x /usr/local/bin/hadolint

        #Установка проверки манифестов кубера
      - name: Install kubeconform
        run: |
          wget -qO /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          sudo chmod +x /usr/local/bin/kubeconform

      - name: lint compose
        run: yamllint -d relaxed docker-compose*.y*ml

      - name: lint dockerfiles
        run: find . -iname "Dockerfile*" -not -path "./node_modules/*" -print0 | xargs -0 -I{} hadolint {}

      - name: lint shell scripts
        run: find . -name "*.sh" -print0 | xargs -0 -I{} shellcheck -P ../../ {}

      - name: lint kubernetes manifests
        run: kubeconform -strict -summary k3s/
  onestage:
    runs-on: ubuntu-latest
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4
      - name: copy .env
        run: cp .env.example .env
      #Build my containers
      - name: Build containers
        run: docker compose build
      # Start containers
      - name: start containers
        run: docker compose up -d
      # check work containers
      - name: check the containers
        run: docker compose ps -a

      - name: wait for backend
        run: |
          for i in $(seq 1 30); do
          if curl -f http://localhost:4000/health; then
          echo "backend ready"
            exit 0
          fi
          echo "waiting... attempt $i"
          sleep 2
          done
          echo "backend did not start in time"
          exit 1

      - name: test chat
        run: docker compose exec -T back node test_chat.js | tee test-report.txt # выполни команду внутри контейнера,back - имя сервиса, node - программа которую запустим, test_chat.js - аргумент программы
      - uses: actions/upload-artifact@v4 #Сохраняем ответ
        with:
          name: test-results
          path: test-report.txt

      #Логинимся в Docker Hub для переноса наших проектов туда
      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{  secrets.DOCKER_PASSWORD }}

      - name: build and push backend
        run: |
          docker tag chat-messenger-back glimpl/chat-messenger-back:latest
          docker tag glimpl/chat-messenger-back:latest glimpl/chat-messenger-back:${GITHUB_SHA::7}
          docker push glimpl/chat-messenger-back:${GITHUB_SHA::7}
          docker push glimpl/chat-messenger-back:latest
      - name: build and push frontend
        run: |
          docker tag chat-messenger-front glimpl/chat-messenger-front:latest
          docker push glimpl/chat-messenger-front:latest
          docker tag glimpl/chat-messenger-front:latest glimpl/chat-messenger-front:${GITHUB_SHA::7}      
          docker push glimpl/chat-messenger-front:${GITHUB_SHA::7}
      #deploy
  deploy:
    runs-on: ubuntu-latest #Будем делать выполнение без self-hosted
    needs: [onestage]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl #Устанвока kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'
      - name: Deploy to k3s cluster
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }} # 1. Кладем конфиг во временную переменную
        run: |
          echo "$KUBE_CONFIG_DATA" > /tmp/kubeconfig.yaml # 2. Создаем РЕАЛЬНЫЙ файл и записываем туда текст
          export KUBECONFIG=/tmp/kubeconfig.yaml          # 3. записываем правильный путь внутрь конфига
          kubectl cluster-info                            # 4. Проверяем связь
          
          # Скачиваем недавно обновленный образ бэкэнда
          kubectl set image deployment/back back=glimpl/chat-messenger-back:${GITHUB_SHA::7} -n chat-messenger 
          
          # Скачиваем недавно обновленный образ фронтенда
          kubectl set image deployment/front front=glimpl/chat-messenger-front:${GITHUB_SHA::7} -n chat-messenger
          
          # Ждем готовности подов 
          kubectl rollout status deployment/back -n chat-messenger --timeout=60s
          kubectl rollout status deployment/front -n chat-messenger --timeout=60s

          
