apiVersion:  apps/v1
kind: Deployment
metadata:
  name: back
  namespace: chat-messenger
  labels:
    app: back
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: back
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: back
    spec:
      restartPolicy: Always
      containers:
        - name: back
          image: docker.io/glimpl/chat-messenger-back:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: back-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10